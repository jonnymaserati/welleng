[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "welleng"
dynamic = ["version"]
description = "A collection of Well Engineering tools"
readme = "README.md"
license = { text = "Apache 2.0" }
authors = [
    { name = "Jonathan Corcutt", email = "jonnycorcutt@gmail.com" }
]
keywords = [
    "well",
    "trajectory",
    "wellpath",
    "wellbore",
    "drilling",
    "drill",
    "error",
    "separation",
    "minimum curvature",
    "iscwsa",
    "owsg",
    "well engineering",
    "wells",
    "drilling engineering",
    "directional drilling",
    "mwd",
    "survey",
    "covariance",
    "digitalization",
    "automation",
    "volve",
    "witsml",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Natural Language :: English",
    "Topic :: Scientific/Engineering",
]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "openpyxl",
    "pandas",
    "pint",
    "pyproj",
    "PyYAML",
    "setuptools",
]

[project.optional-dependencies]
easy = [
    "magnetic_field_calculator",
    "networkx",
    "tabulate",
    "trimesh",
    "utm",
    "vedo",
    "vtk",
]
analytical = [
    "python-flint",
]
# Kick-tolerance extras: coolprop = optional CCUS / reference-EOS mixture gas
# backend; sympy = the envelope/monotonicity analysis. Core kick-tolerance
# (core.py, gas_z.py) needs neither -- only numpy/scipy.
#
# CoolProp is a LOAD-BEARING dependency for the mixture / CO2 / CCUS gas path
# (gas_z_coolprop.py) -- it drives the real-EOS Z(P,T) that the influx presets and
# the metered API tier depend on. It is therefore version-BOUNDED to the tested
# major (8.x), not floated: patch/minor updates are allowed, the next major is
# gated. DO NOT raise the upper bound without first re-running the CoolProp gas
# validation (tests/test_kick_coolprop_ztable.py + the SPE-208788 gas-property
# check) against the new major and confirming numbers hold. Tested against 8.0.0.
kick = [
    "coolprop>=8.0.0,<9",
    "sympy",
]
all = [
    "magnetic_field_calculator",
    "networkx",
    "tabulate",
    "trimesh",
    "utm",
    "python-fcl",
    "rtree",
    "python-flint",
    "coolprop>=8.0.0,<9",   # load-bearing; bounded to tested major (see [kick] note)
    "sympy",
]

[project.urls]
Homepage = "https://github.com/jonnymaserati/welleng"
Download = "https://github.com/jonnymaserati/welleng/releases"

[tool.hatch.version]
path = "welleng/version.py"

[tool.hatch.build.targets.wheel]
packages = ["welleng"]

[tool.hatch.build.targets.wheel.sources]
"welleng" = "welleng"

# Ship the PEP 561 marker so downstream type checkers pick up welleng's
# inline annotations (see docs/dev/TYPING.md, issue #133).
[tool.hatch.build.targets.wheel.force-include]
"welleng/py.typed" = "welleng/py.typed"

[tool.hatch.build.targets.sdist]
# NOTE: `uv build` (and the publish workflow) builds the WHEEL FROM THE SDIST, so
# any package data omitted here is ALSO missing from the published wheel. Ship ALL
# package data recursively (json/yaml/md), not per-directory globs — the previous
# allowlist dropped every *.json (catalog/data + errors/iscwsa_json + iscwsa_schema),
# so 0.17.0's PyPI wheel raised FileNotFoundError on Catalog.load() and the error
# models. Keep the exclude list below as the guard against internal/root content.
include = [
    "welleng/**/*.py",
    "welleng/**/*.json",
    "welleng/**/*.yaml",
    "welleng/**/*.md",
    "welleng/py.typed",
    "README.md",
    "LICENSE",
]
# Belt-and-suspenders: never ship non-package / internal-process content in the
# sdist (hatch otherwise pulls tracked root files past the allowlist above).
exclude = [
    "papers/**",
    "data/**",
    "docs/**",
    "projects/**",
    "reference/**",
    "examples/**",
    "tests/**",
    ".gitignore",
    ".claude/**",
    "**/.claude/**",
    "venv/**",
    ".venv*/**",
    "**/venv/**",
    "*.egg-info/**",
]

[tool.mypy]
# Lenient baseline for gradual typing adoption (issue #133). Modules are
# opted into stricter checking one at a time via per-module overrides below
# as their annotations land. Do NOT enable strict globally: the ~500 as-yet
# unannotated defs would flood the output and drown real findings.
# Matches the dev/CI interpreter. Required >= 3.12 because current numpy
# type stubs use PEP 695 `type` statements that mypy only parses under 3.12+
# (the runtime floor stays 3.10 per [project].requires-python).
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = false
warn_redundant_casts = true
no_implicit_optional = true

# Fully-annotated modules — tighten these as coverage grows.
[[tool.mypy.overrides]]
module = ["welleng.node", "welleng.survey", "welleng.connector", "welleng.units"]
disallow_incomplete_defs = true

[dependency-groups]
dev = [
    "pytest>=9.0",
    "magnetic_field_calculator",
    "networkx",
    "trimesh",
]
