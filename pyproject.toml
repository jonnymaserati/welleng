[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "welleng"
dynamic = ["version"]
description = "A collection of Well Engineering tools"
readme = "README.md"
license = { text = "Apache 2.0" }
authors = [
    { name = "Jonathan Corcutt", email = "jonnycorcutt@gmail.com" }
]
keywords = [
    "well",
    "trajectory",
    "wellpath",
    "wellbore",
    "drilling",
    "drill",
    "error",
    "separation",
    "minimum curvature",
    "iscwsa",
    "owsg",
    "well engineering",
    "wells",
    "drilling engineering",
    "directional drilling",
    "mwd",
    "survey",
    "covariance",
    "digitalization",
    "automation",
    "volve",
    "witsml",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Natural Language :: English",
    "Topic :: Scientific/Engineering",
]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "openpyxl",
    "pandas",
    "pint",
    "pyproj",
    "PyYAML",
    "setuptools",
]

[project.optional-dependencies]
easy = [
    "magnetic_field_calculator",
    "networkx",
    "tabulate",
    "trimesh",
    "utm",
    "vedo",
    "vtk",
]
analytical = [
    "python-flint",
]
all = [
    "magnetic_field_calculator",
    "networkx",
    "tabulate",
    "trimesh",
    "utm",
    "python-fcl",
    "rtree",
    "python-flint",
]

[project.urls]
Homepage = "https://github.com/jonnymaserati/welleng"
Download = "https://github.com/jonnymaserati/welleng/releases"

[tool.hatch.version]
path = "welleng/version.py"

[tool.hatch.build.targets.wheel]
packages = ["welleng"]

[tool.hatch.build.targets.wheel.sources]
"welleng" = "welleng"

# Ship the PEP 561 marker so downstream type checkers pick up welleng's
# inline annotations (see docs/dev/TYPING.md, issue #133).
[tool.hatch.build.targets.wheel.force-include]
"welleng/py.typed" = "welleng/py.typed"

[tool.hatch.build.targets.sdist]
include = [
    "welleng/**/*.py",
    "welleng/py.typed",
    "welleng/errors/*.yaml",
    "welleng/errors/tool_codes/*.yaml",
    "welleng/exchange/*.yaml",
    "README.md",
    "LICENSE",
]

[tool.mypy]
# Lenient baseline for gradual typing adoption (issue #133). Modules are
# opted into stricter checking one at a time via per-module overrides below
# as their annotations land. Do NOT enable strict globally: the ~500 as-yet
# unannotated defs would flood the output and drown real findings.
# Matches the dev/CI interpreter. Required >= 3.12 because current numpy
# type stubs use PEP 695 `type` statements that mypy only parses under 3.12+
# (the runtime floor stays 3.10 per [project].requires-python).
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = false
warn_redundant_casts = true
no_implicit_optional = true

# Fully-annotated modules — tighten these as coverage grows.
[[tool.mypy.overrides]]
module = "welleng.node"
disallow_incomplete_defs = true

[dependency-groups]
dev = [
    "pytest>=9.0",
    "magnetic_field_calculator",
    "networkx",
    "trimesh",
]
